name: profile

on:
  schedule:
    - cron: "17 6 * * *" # daily, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Custom contribution skyline
        if: ${{ !cancelled() }}
        run: node scripts/skyline.mjs --out generated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open-source impact card
        if: ${{ !cancelled() }}
        run: node scripts/oss-card.mjs --out generated --readme README.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        if: ${{ !cancelled() }}
        run: |
          git add README.md generated
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: refresh profile graphics"
          git pull --rebase origin main
          git push
